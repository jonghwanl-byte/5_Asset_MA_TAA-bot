name: TAA Satellite Signal

on:
  schedule:
    # 21:00 UTC = 익일 06:00 KST, 평일 아침 (전 거래일 종가 기준 신호)
    - cron: "0 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taa-satellite-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import yfinance, pandas; print('yfinance', yfinance.__version__, '| pandas', pandas.__version__)"

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 선택: 평가액(KRW)을 넣으면 목표 수량(주)까지 계산
          PORTFOLIO_VALUE: ${{ vars.PORTFOLIO_VALUE }}
          # 선택: "false" 로 두면 비중 변동이 있을 때만 전송
          ALWAYS_SEND: ${{ vars.ALWAYS_SEND }}
          TZ: Asia/Seoul
        run: python satellite_signal.py
