name: TAA Satellite Signal

on:
  schedule:
    # 09:00 UTC = 18:00 KST, 평일만 (KRX 종가 15:30 KST 반영 후 충분한 여유)
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taa-satellite-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TZ: Asia/Seoul
        run: python satellite_signal.py
