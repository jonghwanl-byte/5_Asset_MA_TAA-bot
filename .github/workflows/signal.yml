name: TAA Satellite Signal

on:
  schedule:
    # UTC 기준입니다. 20:15 UTC = 다음날 05:15 KST
    # GitHub 예약 실행은 5~20분 지연될 수 있어 15분 앞당겨 둡니다.
    # UTC 일~금(0-5) = KST 월~토 → 일요일 수신 제외
    - cron: "15 20 * * 0-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taa-satellite-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TZ: Asia/Seoul
        run: python satellite_signal.py
