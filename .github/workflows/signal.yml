name: TAA Satellite Signal

on:
  schedule:
    # UTC 23:00 = 한국시간(KST) 다음날 08:00
    # 일~목 UTC 실행 → 한국 기준 월~금 아침 8시
    - cron: '15 20 * * 0-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taa-satellite-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 선택: 평가액(KRW)을 넣으면 목표 수량(주)까지 계산
          PORTFOLIO_VALUE: ${{ vars.PORTFOLIO_VALUE }}
          # 선택: "false" 로 두면 비중 변동이 있을 때만 전송
          ALWAYS_SEND: ${{ vars.ALWAYS_SEND }}
          TZ: Asia/Seoul
        run: python satellite_signal.py
