name: Keepalive

# GitHub 는 60일간 커밋 활동이 없는 저장소의 schedule 워크플로를 자동 비활성화한다.
# 매월 1일/15일에 타임스탬프 파일만 갱신해 schedule 이 죽지 않도록 유지한다.

on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taa-satellite-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Touch keepalive stamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: keepalive $(date -u +%F)"
          git push
